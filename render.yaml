# Render Blueprint: one free web service built from the Dockerfile. Setup steps: docs/deploy-render-supabase.md
# Nothing secret lives here. Every "sync: false" value is typed into the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: majlis-ku
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Fixed settings.
      - key: DEPLOYED
        value: "1"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_MAX_OBJECT_BYTES
        value: "52428800"
      # Entered in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: HASH_SALT
        sync: false
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
