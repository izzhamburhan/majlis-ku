name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the build can load src/lib/env.ts; CI never connects to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      HASH_SALT: ci-only-hash-salt
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/skills.mjs check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the production image without pushing it, so a Dockerfile or Linux package problem
  # (sharp and ffmpeg-static on glibc, the lockfile made on Windows) shows up before Render builds it.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t majlisku:ci .
